<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="530" viewBox="0 0 1200 530" role="img" aria-labelledby="title desc"><title id="title">Identidad: desarrollador Full Stack y estudiante en Paraguay; sistemas, bases de datos, ingeniería y videojuegos.</title><desc id="desc">CS Digital Forge. Composición original de ingeniería de software.</desc><style>svg{--bg:#f4f1e9;--panel:#e8e7df;--ink:#192d37;--muted:#4c6268;--line:#b9c4bf;--hot:#935330;--cool:#326954}text{font-family:Segoe UI,Arial,sans-serif}.flow{animation:transport 18s linear infinite}@keyframes transport{to{stroke-dashoffset:-160}}@media(prefers-reduced-motion:reduce){.flow{animation:none}}</style><defs><pattern id="hatch" width="12" height="12" patternUnits="userSpaceOnUse" patternTransform="rotate(45)"><path d="M0 0V12" stroke="var(--line)" stroke-width="1"/></pattern></defs><rect x="0" y="0" width="1200" height="530" fill="var(--bg)" /><path d="M32 0V530" stroke="var(--hot)" stroke-width="2"/><circle cx="32" cy="58" r="7" fill="var(--hot)"/><text x="62" y="66" font-size="18" fill="var(--hot)" letter-spacing="2">01 / MATERIA PRIMA</text><g><text x="62" y="125" font-size="56" fill="var(--ink)" font-weight="700" letter-spacing="-2">El punto de partida.</text><text x="64" y="168" font-size="23" fill="var(--muted)" >Software con criterio, curiosidad y propósito.</text><text x="64" y="238" font-size="76" fill="var(--cool)" font-weight="700" letter-spacing="-2">FULL STACK</text><text x="64" y="285" font-size="25" fill="var(--ink)" >Desarrollador de software.</text><text x="64" y="321" font-size="25" fill="var(--ink)" >Estudiante de Ingeniería Informática.</text><text x="64" y="357" font-size="25" fill="var(--ink)" >Paraguay.</text><rect x="64" y="421" width="416" height="46" fill="var(--panel)" /><text x="84" y="451" font-size="19" fill="var(--hot)" >CONSTRUIR / CONECTAR / MEJORAR</text><circle cx="568" cy="213" r="4" fill="var(--hot)"/><path d="M568 220L568 298" fill="none" stroke="var(--line)" /><text x="602" y="220" font-size="20" fill="var(--cool)" letter-spacing="1">SISTEMAS &amp; DATOS</text><text x="602" y="260" font-size="23" fill="var(--muted)" >Aplicaciones web, backend y datos relacionales.</text><circle cx="568" cy="319" r="4" fill="var(--hot)"/><path d="M568 326L568 404" fill="none" stroke="var(--line)" /><text x="602" y="326" font-size="20" fill="var(--cool)" letter-spacing="1">INGENIERÍA</text><text x="602" y="366" font-size="23" fill="var(--muted)" >Soluciones prácticas y mejora de sistemas.</text><circle cx="568" cy="425" r="4" fill="var(--hot)"/><path d="M568 432L568 510" fill="none" stroke="var(--line)" /><text x="602" y="432" font-size="20" fill="var(--cool)" letter-spacing="1">EXPLORACIÓN</text><text x="602" y="472" font-size="23" fill="var(--muted)" >UI/UX y videojuegos; Unity y C# como interés.</text></g></svg>
