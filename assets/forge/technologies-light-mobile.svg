<svg xmlns="http://www.w3.org/2000/svg" width="600" height="1140" viewBox="0 0 600 1140" role="img" aria-labelledby="title desc"><title id="title">Mapa conectado: frontend, backend, bases de datos, herramientas y videojuegos. Unity/C# se identifican como interés sin evidencia pública de proyecto.</title><desc id="desc">CS Digital Forge. Composición original de ingeniería de software.</desc><style>svg{--bg:#f4f1e9;--panel:#e8e7df;--ink:#192d37;--muted:#4c6268;--line:#b9c4bf;--hot:#935330;--cool:#326954}text{font-family:Segoe UI,Arial,sans-serif}.flow{animation:transport 18s linear infinite}@keyframes transport{to{stroke-dashoffset:-160}}@media(prefers-reduced-motion:reduce){.flow{animation:none}}</style><defs><pattern id="hatch" width="12" height="12" patternUnits="userSpaceOnUse" patternTransform="rotate(45)"><path d="M0 0V12" stroke="var(--line)" stroke-width="1"/></pattern></defs><rect x="0" y="0" width="600" height="1140" fill="var(--bg)" /><path d="M32 0V1140" stroke="var(--hot)" stroke-width="2"/><circle cx="32" cy="58" r="7" fill="var(--hot)"/><text x="62" y="66" font-size="18" fill="var(--hot)" letter-spacing="2">02 / HERRAMIENTAS</text><g><text x="62" y="125" font-size="43" fill="var(--ink)" font-weight="700" letter-spacing="-2">Tecnologías en conexión.</text><text x="64" y="168" font-size="21" fill="var(--muted)" >Cada herramienta tiene un lugar en el sistema.</text><path d="M70 290V1000" stroke="var(--hot)" fill="none"/><rect x="92" y="220" width="458" height="140" fill="var(--panel)" stroke="var(--line)" /><path d="M70 270L92 270" fill="none" stroke="var(--hot)" /><circle cx="70" cy="270" r="4" fill="var(--hot)"/><text x="114" y="255" font-size="20" fill="var(--cool)" font-weight="600" letter-spacing="1">FRONTEND</text><text x="114" y="295" font-size="24" fill="var(--ink)" >HTML · CSS · JavaScript</text><text x="114" y="326" font-size="24" fill="var(--ink)" >Interfaces web y consumo de APIs</text><rect x="92" y="390" width="458" height="170" fill="var(--panel)" stroke="var(--line)" /><path d="M70 440L92 440" fill="none" stroke="var(--hot)" /><circle cx="70" cy="440" r="4" fill="var(--hot)"/><text x="114" y="425" font-size="20" fill="var(--cool)" font-weight="600" letter-spacing="1">BACKEND</text><text x="114" y="465" font-size="24" fill="var(--ink)" >Java · Spring Boot · Security</text><text x="114" y="496" font-size="24" fill="var(--ink)" >Python · Flask · PHP</text><text x="114" y="527" font-size="24" fill="var(--ink)" >REST y orientación a objetos</text><rect x="92" y="590" width="458" height="140" fill="var(--panel)" stroke="var(--line)" /><path d="M70 640L92 640" fill="none" stroke="var(--hot)" /><circle cx="70" cy="640" r="4" fill="var(--hot)"/><text x="114" y="625" font-size="20" fill="var(--cool)" font-weight="600" letter-spacing="1">BASES DE DATOS</text><text x="114" y="665" font-size="24" fill="var(--ink)" >Oracle · MySQL · H2 · SQL</text><text x="114" y="696" font-size="24" fill="var(--ink)" >JPA y consultas relacionales</text><rect x="92" y="760" width="458" height="140" fill="var(--panel)" stroke="var(--line)" /><path d="M70 810L92 810" fill="none" stroke="var(--hot)" /><circle cx="70" cy="810" r="4" fill="var(--hot)"/><text x="114" y="795" font-size="20" fill="var(--cool)" font-weight="600" letter-spacing="1">HERRAMIENTAS</text><text x="114" y="835" font-size="24" fill="var(--ink)" >Git · GitHub · Maven · Docker</text><text x="114" y="866" font-size="24" fill="var(--ink)" >Código, dependencias y entornos</text><rect x="92" y="930" width="458" height="140" fill="var(--panel)" stroke="var(--line)" stroke-dasharray="8 6"/><path d="M70 980L92 980" fill="none" stroke="var(--hot)" /><circle cx="70" cy="980" r="4" fill="var(--hot)"/><text x="114" y="965" font-size="20" fill="var(--hot)" font-weight="600" letter-spacing="1">VIDEOJUEGOS</text><text x="114" y="1005" font-size="24" fill="var(--ink)" >Unity · C#</text><text x="114" y="1036" font-size="24" fill="var(--ink)" >Interés declarado / sin proyecto público</text></g></svg>
