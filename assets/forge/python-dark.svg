<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="530" viewBox="0 0 1200 530" role="img" aria-labelledby="title desc"><title id="title">Laboratorio Python. Del lenguaje a los servicios web, una práctica a la vez. Blueprint de login y Swagger UI. Consultas SQL con MySQL. Entornos descritos con contenedores. Python · Flask · MySQL, Docker · Docker Compose. Proyecto educativo.</title><desc id="desc">CS Digital Forge. Composición original de ingeniería de software.</desc><style>svg{--bg:#162129;--panel:#1e2d35;--ink:#f3f0e7;--muted:#b9c5c5;--line:#40535a;--hot:#e5ab80;--cool:#b1cbbb}text{font-family:Segoe UI,Arial,sans-serif}.flow{animation:transport 18s linear infinite}@keyframes transport{to{stroke-dashoffset:-160}}@media(prefers-reduced-motion:reduce){.flow{animation:none}}</style><defs><pattern id="hatch" width="12" height="12" patternUnits="userSpaceOnUse" patternTransform="rotate(45)"><path d="M0 0V12" stroke="var(--line)" stroke-width="1"/></pattern></defs><rect x="0" y="0" width="1200" height="530" fill="var(--bg)" /><path d="M32 0V530" stroke="var(--hot)" stroke-width="2"/><g><text x="64" y="57" font-size="19" fill="var(--hot)" letter-spacing="1">04 / SISTEMA 03 — PRÁCTICAS &amp; EXPERIMENTACIÓN</text><text x="62" y="134" font-size="63" fill="var(--ink)" font-weight="700" letter-spacing="-2">Laboratorio Python</text><text x="64" y="192" font-size="25" fill="var(--muted)" >Del lenguaje a los servicios web,</text><text x="64" y="226" font-size="25" fill="var(--muted)" >una práctica a la vez.</text><g transform="translate(864 200) scale(0.96)"><path d="M15 40H200V190H15Z" fill="url(#hatch)" stroke="var(--line)"/><path d="M30 160H85V40H220M85 100H170V190H220" fill="none" stroke="var(--cool)" stroke-width="12" stroke-linejoin="round"/><circle cx="30" cy="160" r="13" fill="var(--hot)"/><circle cx="220" cy="40" r="13" fill="var(--hot)"/><circle cx="220" cy="190" r="13" fill="var(--hot)"/><path d="M108 74L134 100L108 126L82 100Z" fill="var(--bg)" stroke="var