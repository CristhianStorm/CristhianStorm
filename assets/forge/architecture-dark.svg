<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="660" viewBox="0 0 1200 660" role="img" aria-labelledby="title desc"><title id="title">Arquitectura conceptual: frontend, API, lógica y datos. Se distinguen los flujos realmente verificados en tutorías y productos.</title><desc id="desc">CS Digital Forge. Composición original de ingeniería de software.</desc><style>svg{--bg:#162129;--panel:#1e2d35;--ink:#f3f0e7;--muted:#b9c5c5;--line:#40535a;--hot:#e5ab80;--cool:#b1cbbb}text{font-family:Segoe UI,Arial,sans-serif}.flow{animation:transport 18s linear infinite}@keyframes transport{to{stroke-dashoffset:-160}}@media(prefers-reduced-motion:reduce){.flow{animation:none}}</style><defs><pattern id="hatch" width="12" height="12" patternUnits="userSpaceOnUse" patternTransform="rotate(45)"><path d="M0 0V12" stroke="var(--line)" stroke-width="1"/></pattern></defs><rect x="0" y="0" width="1200" height="660" fill="var(--bg)" /><path d="M32 0V660" stroke="var(--hot)" stroke-width="2"/><circle cx="32" cy="58" r="7" fill="var(--hot)"/><text x="62" y="66" font-size="18" fill="var(--hot)" letter-spacing="2">03 / ENSAMBLAJE</text><g><text x="62" y="125" font-size="56" fill="var(--ink)" font-weight="700" letter-spacing="-2">De la interfaz a los datos.</text><text x="64" y="168" font-size="23" fill="var(--muted)" >Una forma de pensar de extremo a extremo.</text><path d="M180 288H1080" stroke="var(--hot)" stroke-width="2"/><path d="M180 288H1080" stroke="var(--cool)" stroke-width="3" stroke-dasharray="8 24" class="flow"/><rect x="90" y="220" width="240" height="136" fill="var(--panel)" stroke="var(--line)"/><text x="112" y="260" font-size="18" fill="var(--hot)" >01</text><text x="112" y="300" font-size="28" fill="var(--cool)" font-weight="600">FRONTEND</text><text x="112" y="332" font-size="20" fill="var(--muted)" >Interacción</text><rect x="360" y="220" width="240" height="136" fill="var(--panel)" stroke="var(--line)"/><text x="382" y="260" font-size="18" fill="var(--hot)" >02</text><text x="382" y="300" font-size="28" fill="var(--cool)" font-weight="600">API</text><text x="382" y="332" font-size="20" fill="var(--muted)" >Contrato HTTP</text><rect x="630" y="220" width="240" height="136" fill="var(--panel)" stroke="var(--line)"/><text x="652" y="260" font-size="18" fill="var(--hot)" >03</text><text x="652" y="300" font-size="28" fill="var(--cool)" font-weight="600">LÓGICA</text><text x="652" y="332" font-size="20" fill="var(--muted)" >Reglas del sistema</text><rect x="900" y="220" width="240" height="136" fill="var(--panel)" stroke="var(--line)"/><text x="922" y="260" font-size="18" fill="var(--hot)" >04</text><text x="922" y="300" font-size="28" fill="var(--cool)" font-weight="600">DATOS</text><text x="922" y="332" font-size="20" fill="var(--muted)" >Persistencia</text><text x="92" y="401" font-size="19" fill="var(--hot)" letter-spacing="1">ESQUEMA CONCEPTUAL / NO UN DESPLIEGUE</text><path d="M92 437L1140 437" fill="none" stroke="var(--line)" /><text x="92" y="479" font-size="20" fill="var(--cool)" >EN EL CÓDIGO</text><text x="92" y="522" font-size="24" fill="var(--muted)" >Tutorías: controladores, servicios, repositorios JPA y entidades.</text><text x="92" y="558" font-size="24" fill="var(--muted)" >Hay accesos directos desde algunos controladores a los repositorios.</text><text x="92" y="594" font-size="24" fill="var(--muted)" >Productos: controlador → repositorio. Su servicio aún no integra ese flujo.</text></g></svg>
