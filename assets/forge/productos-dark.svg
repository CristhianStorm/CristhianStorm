<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="530" viewBox="0 0 1200 530" role="img" aria-labelledby="title desc"><title id="title">API de productos. Gestionar productos, precio y stock mediante una API REST educativa. Crear, listar, actualizar y eliminar. Validación de precio y stock. Estadísticas del catálogo. Java 21 · Spring Boot, Spring Data JPA · H2 · Maven. Proyecto educativo.</title><desc id="desc">CS Digital Forge. Composición original de ingeniería de software.</desc><style>svg{--bg:#162129;--panel:#1e2d35;--ink:#f3f0e7;--muted:#b9c5c5;--line:#40535a;--hot:#e5ab80;--cool:#b1cbbb}text{font-family:Segoe UI,Arial,sans-serif}.flow{animation:transport 18s linear infinite}@keyframes transport{to{stroke-dashoffset:-160}}@media(prefers-reduced-motion:reduce){.flow{animation:none}}</style><defs><pattern id="hatch" width="12" height="12" patternUnits="userSpaceOnUse" patternTransform="rotate(45)"><path d="M0 0V12" stroke="var(--line)" stroke-width="1"/></pattern></defs><rect x="0" y="0" width="1200" height="530" fill="var(--bg)" /><path d="M32 0V530" stroke="var(--hot)" stroke-width="2"/><g><text x="64" y="57" font-size="19" fill="var(--hot)" letter-spacing="1">04 / SISTEMA 02 — PRÁCTICA DE BACKEND</text><text x="62" y="134" font-size="63" fill="var(--ink)" font-weight="700" letter-spacing="-2">API de productos</text><text x="64" y="192" font-size="25" fill="var(--muted)" >Gestionar productos, precio y stock</text><text x="64" y="226" font-size="25" fill="var(--muted)" >mediante una API REST educativa.</text><g transform="translate(864 200) scale(0.96)"><path d="M120 10L225 70L120 130L15 70Z" fill="var(--panel)" stroke="var(--cool)" stroke-width="2"/><path d="M15 70V180L120 240L225 180V70M120 130V240" fill="none" stroke="var(--cool)" stroke-width="2"/><path d="M67 40L173 101V165L150 178V114L44 54Z" fill="var(--hot)"/><path d="M45 157L90 183M45 173L76 191" stroke="var(--line)" stroke-width="3"/></g><path d="M776 167L776 450" fill="none" stroke="var(--line)" /><text x="64" y="290" font-size="18" fill="var(--cool)" letter-spacing="1">PIEZAS DEL SISTEMA</text><circle cx="68" cy="325" r="3" fill="var(--hot)"/><text x="85" y="333" font-size="24" fill="var(--ink)" >Crear, listar, actualizar y eliminar</text><circle cx="68" cy="361" r="3" fill="var(--hot)"/><text x="85" y="369" font-size="24" fill="var(--ink)" >Validación de precio y stock</text><circle cx="68" cy="397" r="3" fill="var(--hot)"/><text x="85" y="405" font-size="24" fill="var(--ink)" >Estadísticas del catálogo</text><text x="64" y="462" font-size="23" fill="var(--cool)" >Java 21 · Spring Boot</text><text x="64" y="493" font-size="23" fill="var(--cool)" >Spring Data JPA · H2 · Maven</text><text x="842" y="486" font-size="20" fill="var(--hot)" >VER REPOSITORIO ↗</text></g></svg>
