<svg xmlns="http://www.w3.org/2000/svg" width="600" height="700" viewBox="0 0 600 700" role="img" aria-labelledby="title desc"><title id="title">Interfaces web con HTML, CSS y JavaScript. Prácticas PHP de arreglos y orientación a objetos.</title><desc id="desc">CS Digital Forge. Composición original de ingeniería de software.</desc><style>svg{--bg:#f4f1e9;--panel:#e8e7df;--ink:#192d37;--muted:#4c6268;--line:#b9c4bf;--hot:#935330;--cool:#326954}text{font-family:Segoe UI,Arial,sans-serif}.flow{animation:transport 18s linear infinite}@keyframes transport{to{stroke-dashoffset:-160}}@media(prefers-reduced-motion:reduce){.flow{animation:none}}</style><defs><pattern id="hatch" width="12" height="12" patternUnits="userSpaceOnUse" patternTransform="rotate(45)"><path d="M0 0V12" stroke="var(--line)" stroke-width="1"/></pattern></defs><rect x="0" y="0" width="600" height="700" fill="var(--bg)" /><path d="M32 0V700" stroke="var(--hot)" stroke-width="2"/><circle cx="32" cy="58" r="7" fill="var(--hot)"/><text x="62" y="66" font-size="18" fill="var(--hot)" letter-spacing="2">05 / EXPLORACIÓN</text><g><text x="62" y="125" font-size="43" fill="var(--ink)" font-weight="700" letter-spacing="-2">Otras piezas del taller.</text><text x="64" y="168" font-size="21" fill="var(--muted)" >Aprender también es construir.</text><path d="M64 211L550 211" fill="none" stroke="var(--line)" /><text x="64" y="247" font-size="26" fill="var(--cool)" font-weight="600">WEB / INTERFACES</text><text x="64" y="289" font-size="24" fill="var(--ink)" >HTML · CSS · JavaScript</text><text x="64" y="333" font-size="21" fill="var(--muted)" >Neo Jumper y una interfaz visual de acceso.</text><text x="64" y="364" font-size="21" fill="var(--muted)" >Composición, estilos y navegación.</text><path d="M64 431L550 431" fill="none" stroke="var(--line)" /><text x="64" y="467" font-size="26" fill="var(--cool)" font-weight="600">PHP / FUNDAMENTOS</text><text x="64" y="509" font-size="24" fill="var(--ink)" >PHP · POO</text><tex