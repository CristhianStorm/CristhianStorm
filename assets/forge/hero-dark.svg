<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="570" viewBox="0 0 1200 570" role="img" aria-labelledby="title desc"><title id="title">Cristhian Storm. Full Stack Developer. Las ideas toman forma. Los sistemas se conectan.</title><desc id="desc">CS Digital Forge. Composición original de ingeniería de software.</desc><style>svg{--bg:#162129;--panel:#1e2d35;--ink:#f3f0e7;--muted:#b9c5c5;--line:#40535a;--hot:#e5ab80;--cool:#b1cbbb}text{font-family:Segoe UI,Arial,sans-serif}.flow{animation:transport 18s linear infinite}@keyframes transport{to{stroke-dashoffset:-160}}@media(prefers-reduced-motion:reduce){.flow{animation:none}}</style><defs><pattern id="hatch" width="12" height="12" patternUnits="userSpaceOnUse" patternTransform="rotate(45)"><path d="M0 0V12" stroke="var(--line)" stroke-width="1"/></pattern></defs><rect x="0" y="0" width="1200" height="570" fill="var(--bg)" /><path d="M32 0V570" stroke="var(--hot)" stroke-width="2"/><g><text x="64" y="57" font-size="23" fill="var(--hot)" letter-spacing="3">CS // DIGITAL FORGE</text><text x="60" y="191" font-size="94" fill="var(--ink)" font-weight="750" letter-spacing="-4">CRISTHIAN</text><text x="55" y="310" font-size="148" fill="var(--ink)" font-weight="750" letter-spacing="-6">STORM</text><text x="64" y="365" font-size="30" fill="var(--cool)" >Full Stack Developer</text><text x="64" y="425" font-size="28" fill="var(--ink)" >Las ideas toman forma.</text><text x="64" y="463" font-size="28" fill="var(--ink)" >Los sistemas se conectan.</text><g transform="translate(806 150) scale(1.26)" fill="none"><path d="M112 29C81 4 18 15 18 80C18 144 81 156 112 130" stroke="var(--cool)" stroke-width="25"/><path d="M228 32C203 3 141 12 142 51C143 89 228 70 228 111C228 153 164 157 139 127" stroke="var(--hot)" stroke-width="25"/><path d="M89 80H169" stroke="var(--bg)" stroke-width="11"/><path d="M89 80H169" stroke="var(--ink)" stroke-width="2"/><path d="M112 29L96 17M112 130L96 143M228 32L211 18M139 127L156 142" stroke="var(--ink)" stroke-width="1.5"/></g><path d="M745 70V465H1140M776 124H1135V404H776Z" fill="none" stroke="var(--line)"/><path d="M776 109H1135M1150 124V404" stroke="var(--hot)" stroke-width="2"/><path d="M806 124V404M885 124V404M964 124V404M1043 124V404M776 194H1135M776 264H1135M776 334H1135" stroke="var(--line)" opacity=".35"/><text x="812" y="450" font-size="18" fill="var(--muted)" >DISEÑAR / CONSTRUIR / ITERAR</text><path d="M64 505L1160 505" fill="none" stroke="var(--line)" /><text x="64" y="541" font-size="19" fill="var(--muted)" >PARAGUAY</text><text x="800" y="541" font-size="19" fill="var(--cool)" >INGENIERÍA CON IDENTIDAD</text></g></svg>
