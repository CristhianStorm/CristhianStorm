<svg xmlns="http://www.w3.org/2000/svg" width="600" height="1075" viewBox="0 0 600 1075" role="img" aria-labelledby="title desc"><title id="title">Arquitectura conceptual: frontend, API, lógica y datos. Se distinguen los flujos realmente verificados en tutorías y productos.</title><desc id="desc">CS Digital Forge. Composición original de ingeniería de software.</desc><style>svg{--bg:#162129;--panel:#1e2d35;--ink:#f3f0e7;--muted:#b9c5c5;--line:#40535a;--hot:#e5ab80;--cool:#b1cbbb}text{font-family:Segoe UI,Arial,sans-serif}.flow{animation:transport 18s linear infinite}@keyframes transport{to{stroke-dashoffset:-160}}@media(prefers-reduced-motion:reduce){.flow{animation:none}}</style><defs><pattern id="hatch" width="12" height="12" patternUnits="userSpaceOnUse" patternTransform="rotate(45)"><path d="M0 0V12" stroke="var(--line)" stroke-width="1"/></pattern></defs><rect x="0" y="0" width="600" height="1075" fill="var(--bg)" /><path d="M32 0V1075" stroke="var(--hot)" stroke-width="2"/><circle cx="32" cy="58" r="7" fill="var(--hot)"/><text x="62" y="66" font-size="18" fill="var(--hot)" letter-spacing="2">03 / ENSAMBLAJE</text><g><text x="62" y="125" font-size="43" fill="var(--ink)" font-weight="700" letter-spacing="-2">De la interfaz a los datos.</text><text x="64" y="168" font-size="21" fill="var(--muted)" >Una forma de pensar de extremo a extremo.</text><path d="M300 255V775" stroke="var(--hot)" stroke-width="2"/><path d="M300 255V775" stroke="var(--cool)" stroke-width="3" stroke-dasharray="8 24" class="flow"/><rect x="92" y="230" width="458" height="108" fill="var(--panel)" stroke="var(--line)"/><text x="120" y="273" font-size="27" fill="var(--cool)" font-weight="600">FRONTEND</text><text x="120" y="308" font-size="23" fill="var(--muted)" >Interacción</text><text x="500" y="272" font-size="21" fill="var(--hot)" >1</text><rect x="92" y="375" width="458" height="108" fill="var(--panel)" stroke="var(--line)"/><text x="120" y="418" font-size="27" fill="var(--cool)" font-weight="600">API</text><text x="120" y="453" font-size="23" fill="var(--muted)" >Contrato HTTP</text><text x="500" y="417" font-size="21" fill="var(--hot)" >2</text><rect x="92" y="520" width="458" height="108" fill="var(--panel)" stroke="var(--line)"/><text x="120" y="563" font-size="27" fill="var(--cool)" font-weight="600">LÓGICA</text><text x="120" y="598" font-size="23" fill="var(--muted)" >Reglas del sistema</text><text x="500" y="562" font-size="21" fill="var(--hot)" >3</text><rect x="92" y="665" width="458" height="108" fill="var(--panel)" stroke="var(--line)"/><text x="120" y="708" font-size="27" fill="var(--cool)" font-weight="600">DATOS</text><text x="120" y="743" font-size="23" fill="var(--muted)" >Persistencia</text><text x="500" y="707" font-size="21" fill="var(--hot)" >4</text><text x="64" y="862" font-size="18" fill="var(--hot)" >ESQUEMA CONCEPTUAL / NO UN DESPLIEGUE</text><text x="64" y="906" font-size="23" fill="var(--muted)" >En tutorías: controladores, servicios y JPA.</text><text x="64" y="937" font-size="23" fill="var(--muted)" >Algunos controladores consultan datos</text><text x="64" y="968" font-size="23" fill="var(--muted)" >directamente. En productos, el controlador</text><text x="64" y="999" font-size="23" fill="var(--muted)" >usa el repositorio; el servicio aún no está</text><text x="64" y="1030" font-size="23" fill="var(--muted)" >integrado en ese flujo.</text></g></svg>
