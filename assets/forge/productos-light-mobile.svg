<svg xmlns="http://www.w3.org/2000/svg" width="600" height="870" viewBox="0 0 600 870" role="img" aria-labelledby="title desc"><title id="title">API de productos. Gestionar productos, precio y stock mediante una API REST educativa. Crear, listar, actualizar y eliminar. Validación de precio y stock. Estadísticas del catálogo. Java 21 · Spring Boot, Spring Data JPA · H2 · Maven. Proyecto educativo.</title><desc id="desc">CS Digital Forge. Composición original de ingeniería de software.</desc><style>svg{--bg:#f4f1e9;--panel:#e8e7df;--ink:#192d37;--muted:#4c6268;--line:#b9c4bf;--hot:#935330;--cool:#326954}text{font-family:Segoe UI,Arial,sans-serif}.flow{animation:transport 18s linear infinite}@keyframes transport{to{stroke-dashoffset:-160}}@media(prefers-reduced-motion:reduce){.flow{animation:none}}</style><defs><pattern id="hatch" width="12" height="12" patternUnits="userSpaceOnUse" patternTransform="rotate(45)"><path d="M0 0V12" stroke="var(--line)" stroke-width="1"/></pattern></defs><rect x="0" y="0" width="600" height="870" fill="var(--bg)" /><path d="M32 0V870" stroke="var(--hot)" stroke-width="2"/><g><text x="64" y="57" font-size="18" fill="var(--hot)" letter-spacing="1">04 / SISTEMA 02 — PRÁCTICA DE BACKEND</text><text x="62" y="125" font-size="44" fill="var(--ink)" font-weight="700" letter-spacing="-2">API de productos</text><text x="64" y="179" font-size="24" fill="var(--muted)" >Gestionar productos, precio y stock</text><text x="64" y="213" font-size="24" fill="var(--muted)" >mediante una API REST educativa.</text><path d="M64 244L550 244" fill="none" stroke="var(--line)" /><g transform="translate(350 270) scale(0.62)"><path d="M120 10L225 70L120 130L15 70Z" fill="var(--panel)" stroke="var(--cool)" stroke-width="2"/><path d="M15 70V180L120 240L225 180V70M120 130V240" fill="none" stroke="var(--cool)" stroke-width="2"/><path d="M67 40L173 101V165L150 178V114L44 54Z" fill="var(--hot)"/><path d="M45 157L90 183M45 173L76 191" stroke="var(--line)" stroke-width="3"/>