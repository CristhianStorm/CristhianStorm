<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="740" viewBox="0 0 1200 740" role="img" aria-labelledby="title desc"><title id="title">Mapa conectado: frontend, backend, bases de datos, herramientas y videojuegos. Unity/C# se identifican como interés sin evidencia pública de proyecto.</title><desc id="desc">CS Digital Forge. Composición original de ingeniería de software.</desc><style>svg{--bg:#f4f1e9;--panel:#e8e7df;--ink:#192d37;--muted:#4c6268;--line:#b9c4bf;--hot:#935330;--cool:#326954}text{font-family:Segoe UI,Arial,sans-serif}.flow{animation:transport 18s linear infinite}@keyframes transport{to{stroke-dashoffset:-160}}@media(prefers-reduced-motion:reduce){.flow{animation:none}}</style><defs><pattern id="hatch" width="12" height="12" patternUnits="userSpaceOnUse" patternTransform="rotate(45)"><path d="M0 0V12" stroke="var(--line)" stroke-width="1"/></pattern></defs><rect x="0" y="0" width="1200" height="740" fill="var(--bg)" /><path d="M32 0V740" stroke="var(--hot)" stroke-width="2"/><circle cx="32" cy="58" r="7" fill="var(--hot)"/><text x="62" y="66" font-size="18" fill="var(--hot)" letter-spacing="2">02 / HERRAMIENTAS</text><g><text x="62" y="125" font-size="56" fill="var(--ink)" font-weight="700" letter-spacing="-2">Tecnologías en conexión.</text><text x="64" y="168" font-size="23" fill="var(--muted)" >Cada herramienta tiene un lugar en el sistema.</text><path d="M540 300H595V660H310M595 300H650M540 495H650" stroke="var(--hot)" fill="none"/><rect x="90" y="222" width="450" height="155" fill="var(--panel)" stroke="var(--line)" /><text x="112" y="257" font-size="20" fill="var(--cool)" font-weight="600" letter-spacing="1">FRONTEND</text><text x="112" y="297" font-size="25" fill="var(--ink)" >HTML · CSS · JavaScript</text><text x="112" y="328" font-size="25" fill="var(--ink)" >Interfaces web y consumo de APIs</text><rect x="650" y="222" width="490" height="155" fill="var(--panel)" stroke="var(--line)" /><text x="672" y="257" font-size="20" fill="var(--cool)" font-weight="600" letter-spacing="1">BACKEND</text><text x="672" y="297" font-size="25" fill="var(--ink)" >Java · Spring Boot · Spring Security</text><text x="672" y="328" font-size="25" fill="var(--ink)" >Python · Flask · PHP / REST y POO</text><rect x="90" y="420" width="450" height="155" fill="var(--panel)" stroke="var(--line)" /><text x="112" y="455" font-size="20" fill="var(--cool)" font-weight="600" letter-spacing="1">BASES DE DATOS</text><text x="112" y="495" font-size="25" fill="var(--ink)" >Oracle · MySQL · H2 · SQL</text><text x="112" y="526" font-size="25" fill="var(--ink)" >JPA y consultas relacionales</text><rect x="650" y="420" width="490" height="155" fill="var(--panel)" stroke="var(--line)" /><text x="672" y="455" font-size="20" fill="var(--cool)" font-weight="600" letter-spacing="1">HERRAMIENTAS</text><text x="672" y="495" font-size="25" fill="var(--ink)" >Git · GitHub · Maven · Docker</text><text x="672" y="526" font-size="25" fill="var(--ink)" >Código, dependencias y entornos</text><rect x="310" y="617" width="830" height="88" fill="var(--panel)" stroke="var(--line)" stroke-dasharray="8 6"/><text x="332" y="648" font-size="19" fill="var(--hot)" letter-spacing="1">VIDEOJUEGOS</text><text x="332" y="680" font-size="23" fill="var(--muted)" >Unity · C# — interés declarado; sin proyecto público</text></g></svg>
