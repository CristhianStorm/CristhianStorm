<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="430" viewBox="0 0 1200 430" role="img" aria-labelledby="title desc"><title id="title">Interfaces web con HTML, CSS y JavaScript. Prácticas PHP de arreglos y orientación a objetos.</title><desc id="desc">CS Digital Forge. Composición original de ingeniería de software.</desc><style>svg{--bg:#162129;--panel:#1e2d35;--ink:#f3f0e7;--muted:#b9c5c5;--line:#40535a;--hot:#e5ab80;--cool:#b1cbbb}text{font-family:Segoe UI,Arial,sans-serif}.flow{animation:transport 18s linear infinite}@keyframes transport{to{stroke-dashoffset:-160}}@media(prefers-reduced-motion:reduce){.flow{animation:none}}</style><defs><pattern id="hatch" width="12" height="12" patternUnits="userSpaceOnUse" patternTransform="rotate(45)"><path d="M0 0V12" stroke="var(--line)" stroke-width="1"/></pattern></defs><rect x="0" y="0" width="1200" height="430" fill="var(--bg)" /><path d="M32 0V430" stroke="var(--hot)" stroke-width="2"/><circle cx="32" cy="58" r="7" fill="var(--hot)"/><text x="62" y="66" font-size="18" fill="var(--hot)" letter-spacing="2">05 / EXPLORACIÓN</text><g><text x="62" y="125" font-size="56" fill="var(--ink)" font-weight="700" letter-spacing="-2">Otras piezas del taller.</text><text x="64" y="168" font-size="23" fill="var(--muted)" >Aprender también es construir.</text><path d="M64 205L570 205" fill="none" stroke="var(--line)" /><text x="64" y="241" font-size="27" fill="var(--cool)" font-weight="600">WEB / INTERFACES</text><text x="64" y="283" font-size="23" fill="var(--ink)" >HTML · CSS · JavaScript</text><text x="64" y="327" font-size="22" fill="var(--muted)" >Neo Jumper y una interfaz visual de acceso.</text><text x="64" y="358" font-size="22" fill="var(--muted)" >Composición, estilos y navegación.</text><path d="M620 205L1126 205" fill="none" stroke="var(--line)" /><text x="620" y="241" font-size="27" fill="var(--cool)" font-weight="600">PHP / FUNDAMENTOS</text><text x="620" y="283" font-size="23" fill="var(--ink)" >PHP · POO</text><text x="620" y="327" font-size="22" fill="var(--muted)" >Arreglos, clases y herencia en prácticas.</text><text x="620" y="358" font-size="22" fill="var(--muted)" >Ejercicios de aprendizaje, no una app completa.</text></g></svg>
