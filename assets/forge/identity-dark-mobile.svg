<svg xmlns="http://www.w3.org/2000/svg" width="600" height="760" viewBox="0 0 600 760" role="img" aria-labelledby="title desc"><title id="title">Identidad: desarrollador Full Stack y estudiante en Paraguay; sistemas, bases de datos, ingeniería y videojuegos.</title><desc id="desc">CS Digital Forge. Composición original de ingeniería de software.</desc><style>svg{--bg:#162129;--panel:#1e2d35;--ink:#f3f0e7;--muted:#b9c5c5;--line:#40535a;--hot:#e5ab80;--cool:#b1cbbb}text{font-family:Segoe UI,Arial,sans-serif}.flow{animation:transport 18s linear infinite}@keyframes transport{to{stroke-dashoffset:-160}}@media(prefers-reduced-motion:reduce){.flow{animation:none}}</style><defs><pattern id="hatch" width="12" height="12" patternUnits="userSpaceOnUse" patternTransform="rotate(45)"><path d="M0 0V12" stroke="var(--line)" stroke-width="1"/></pattern></defs><rect x="0" y="0" width="600" height="760" fill="var(--bg)" /><path d="M32 0V760" stroke="var(--hot)" stroke-width="2"/><circle cx="32" cy="58" r="7" fill="var(--hot)"/><text x="62" y="66" font-size="18" fill="var(--hot)" letter-spacing="2">01 / MATERIA PRIMA</text><g><text x="62" y="125" font-size="43" fill="var(--ink)" font-weight="700" letter-spacing="-2">El punto de partida.</text><text x="64" y="168" font-size="21" fill="var(--muted)" >Software con criterio, curiosidad y propósito.</text><text x="64" y="235" font-size="55" fill="var(--cool)" font-weight="700" letter-spacing="-2">FULL STACK</text><text x="64" y="287" font-size="25" fill="var(--ink)" >Desarrollador de software y estudiante</text><text x="64" y="324.5" font-size="25" fill="var(--ink)" >de Ingeniería Informática en Paraguay.</text><path d="M64 360L550 360" fill="none" stroke="var(--line)" /><text x="64" y="409" font-size="18" fill="var(--hot)" >01</text><text x="114" y="409" font-size="21" fill="var(--cool)" font-weight="600">SISTEMAS &amp; DATOS</text><text x="114" y="444" font-size="23" fill="var(--muted)" >Aplicaciones web, servicios backend</text><text x="114" y="474" font-size="23" fill="var(--muted)" >y bases de datos relacionales.</text><text x="64" y="524" font-size="18" fill="var(--hot)" >02</text><text x="114" y="524" font-size="21" fill="var(--cool)" font-weight="600">INGENIERÍA</text><text x="114" y="559" font-size="23" fill="var(--muted)" >Soluciones prácticas, automatización</text><text x="114" y="589" font-size="23" fill="var(--muted)" >y mejora de sistemas existentes.</text><text x="64" y="639" font-size="18" fill="var(--hot)" >03</text><text x="114" y="639" font-size="21" fill="var(--cool)" font-weight="600">EXPLORACIÓN</text><text x="114" y="674" font-size="23" fill="var(--muted)" >UI/UX y desarrollo de videojuegos.</text><text x="114" y="704" font-size="23" fill="var(--muted)" >Unity y C# como interés declarado.</text></g></svg>
