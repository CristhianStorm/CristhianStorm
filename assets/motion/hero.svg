<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="455" viewBox="0 0 1000 455" role="img" aria-labelledby="title"><title id="title">Cristhian Storm. Desarrollador web y backend. Portada animada con luces, terminal flotante y texto que se escribe.</title><style>
.float{animation:float 7s ease-in-out infinite}.float2{animation:float 9s ease-in-out infinite reverse}.orbit{transform-origin:790px 215px;animation:orbit 35s linear infinite}.blink{animation:blink 1.2s steps(2,end) infinite}.signal{animation:signal 4s ease-in-out infinite}.flow{stroke-dasharray:12 20;animation:flow 5s linear infinite}.type{animation:type 8s steps(32,end) infinite}.reveal{animation:reveal 5s ease-in-out infinite}
@keyframes float{0%,100%{transform:translateY(0)}50%{transform:translateY(-14px)}}@keyframes orbit{to{transform:rotate(360deg)}}@keyframes blink{50%{opacity:0}}@keyframes signal{0%,100%{opacity:.25}50%{opacity:1}}@keyframes flow{to{stroke-dashoffset:-256}}@keyframes type{0%,5%{width:0}40%,80%{width:490px}97%,100%{width:0}}@keyframes reveal{0%,100%{opacity:.4}50%{opacity:1}}
@media(prefers-reduced-motion:reduce){.float,.float2,.orbit,.blink,.signal,.flow,.type,.reveal{animation:none}}
</style><defs>
<linearGradient id="bg" x2="1" y2="1"><stop stop-color="#0B1026"/><stop offset="1" stop-color="#11132C"/></linearGradient>
