<radialGradient id="glow"><stop stop-color="#7947EA" stop-opacity=".35"/><stop offset="1" stop-color="#7947EA" stop-opacity="0"/></radialGradient>
<pattern id="grid" width="32" height="32" patternUnits="userSpaceOnUse"><path d="M32 0H0V32" fill="none" stroke="#7680B7" stroke-width=".5" opacity=".13"/></pattern>
<clipPath id="typing"><rect class="type" x="52" y="293" width="490" height="38"/></clipPath>
</defs>
